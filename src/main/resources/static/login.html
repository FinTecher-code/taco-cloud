<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Blog Admin</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="login-page">
    <div class="login-card">
        <h1>Blog Admin</h1>
        <p class="subtitle">博客管理系统</p>

        <div class="error-msg" id="errorMsg">用户名或密码错误</div>

        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" class="form-input" placeholder="请输入用户名" autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" class="form-input" placeholder="请输入密码" autocomplete="current-password">
        </div>

        <button class="btn btn-primary" id="loginBtn" style="width:100%; padding:10px 0; font-size:16px; margin-top:8px;">
            登 录
        </button>
    </div>

    <script src="/js/common.js"></script>
    <script>
        // 如果已经登录，直接跳转仪表盘
        if (getCurrentUser()) {
            window.location.href = '/dashboard.html';
        }

        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        /** 执行登录 */
        async function doLogin() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                errorMsg.textContent = '用户名和密码不能为空';
                errorMsg.classList.add('show');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';
            errorMsg.classList.remove('show');

            try {
                const res = await apiPost('/api/users/login', { username, password });

                if (res.code === 200 && res.data) {
                    // 登录成功，保存用户信息到 sessionStorage
                    sessionStorage.setItem('currentUser', JSON.stringify(res.data));
                    window.location.href = '/dashboard.html';
                } else {
                    errorMsg.textContent = res.message || '用户名或密码错误';
                    errorMsg.classList.add('show');
                }
            } catch (e) {
                errorMsg.textContent = '网络错误，请重试';
                errorMsg.classList.add('show');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登 录';
            }
        }

        // 点击登录按钮
        loginBtn.addEventListener('click', doLogin);

        // 按回车键提交
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doLogin();
        });
        usernameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') passwordInput.focus();
        });
    </script>
</body>
</html>
