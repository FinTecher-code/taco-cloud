<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - Blog Admin</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
    <div class="admin-layout">
        <!-- 侧边栏由 JS 渲染 -->
        <div class="sidebar" id="sidebar"></div>

        <!-- 主内容 -->
        <div class="main-content">
            <div class="page-header">
                <h2>仪表盘</h2>
            </div>

            <!-- 统计卡片 -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card blue">
                    <div class="stat-value" id="articleCount">-</div>
                    <div class="stat-label">文章总数</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-value" id="publishedCount">-</div>
                    <div class="stat-label">已发布</div>
                </div>
                <div class="stat-card orange">
                    <div class="stat-value" id="draftCount">-</div>
                    <div class="stat-label">草稿</div>
                </div>
                <div class="stat-card purple">
                    <div class="stat-value" id="categoryCount">-</div>
                    <div class="stat-label">分类数</div>
                </div>
            </div>

            <!-- 最近文章 -->
            <div class="card">
                <h3 style="margin-bottom:16px;">最近文章</h3>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>标题</th>
                                <th>作者</th>
                                <th>分类</th>
                                <th>状态</th>
                                <th>时间</th>
                            </tr>
                        </thead>
                        <tbody id="recentArticles">
                            <tr><td colspan="5" class="loading">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script>
        // 检查登录
        const user = checkAuth();
        renderSidebar();

        /** 加载统计数据 */
        async function loadStats() {
            try {
                // 获取所有文章
                const artRes = await apiGet('/api/articles?size=1000');
                if (artRes.code === 200 && artRes.data) {
                    const records = artRes.data.records || [];
                    const total = records.length;
                    const published = records.filter(r => r.status === 1).length;
                    const drafts = records.filter(r => r.status === 0).length;

                    document.getElementById('articleCount').textContent = total;
                    document.getElementById('publishedCount').textContent = published;
                    document.getElementById('draftCount').textContent = drafts;
                }

                // 获取分类数
                const catRes = await apiGet('/api/categories');
                if (catRes.code === 200 && catRes.data) {
                    document.getElementById('categoryCount').textContent = catRes.data.length;
                }
            } catch (e) {
                console.error('加载统计失败', e);
            }
        }

        /** 加载最近 5 篇文章 */
        async function loadRecentArticles() {
            const tbody = document.getElementById('recentArticles');
            try {
                const res = await apiGet('/api/articles?size=5');
                if (res.code === 200 && res.data) {
                    const records = res.data.records || [];
                    if (records.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">暂无文章</td></tr>';
                        return;
                    }
                    tbody.innerHTML = records.map(a => `
                        <tr>
                            <td><a href="javascript:void(0)" onclick="viewArticle(${a.id})">${escapeHtml(a.title)}</a></td>
                            <td>${escapeHtml(a.username || '-')}</td>
                            <td>${escapeHtml(a.categoryName || '-')}</td>
                            <td><span class="tag ${a.status === 1 ? 'tag-green' : 'tag-orange'}">${a.status === 1 ? '已发布' : '草稿'}</span></td>
                            <td>${formatDateTime(a.createdAt)}</td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">加载失败</td></tr>';
            }
        }

        /** 查看文章详情 */
        async function viewArticle(id) {
            try {
                const res = await apiGet('/api/articles/' + id);
                if (res.code === 200 && res.data) {
                    const a = res.data;
                    showModal('文章详情', `
                        <div class="form-group">
                            <label>标题</label>
                            <div style="font-size:16px;font-weight:600;">${escapeHtml(a.title)}</div>
                        </div>
                        <div class="form-group">
                            <label>作者 / 分类</label>
                            <div>${escapeHtml(a.username || '-')} / ${escapeHtml(a.categoryName || '-')}</div>
                        </div>
                        <div class="form-group">
                            <label>摘要</label>
                            <div style="color:#666;">${escapeHtml(a.summary || '-')}</div>
                        </div>
                        <div class="form-group">
                            <label>浏览量 / 点赞量</label>
                            <div>${a.viewCount || 0} / ${a.likeCount || 0}</div>
                        </div>
                        <div class="form-group">
                            <label>内容</label>
                            <div style="background:#fafafa;padding:12px;border-radius:4px;max-height:300px;overflow-y:auto;white-space:pre-wrap;font-size:13px;">${escapeHtml(a.content || '')}</div>
                        </div>
                    `);
                }
            } catch (e) {
                showToast('加载失败', 'error');
            }
        }

        loadStats();
        loadRecentArticles();
    </script>
</body>
</html>
